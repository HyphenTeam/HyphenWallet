name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, artifact: hyphen-wallet-linux-x86_64, agent: hyphen-payout-agent }
          - { os: windows-2022, platform: windows, artifact: hyphen-wallet-windows-x86_64, agent: hyphen-payout-agent.exe }
          - { os: macos-14, platform: macos, artifact: hyphen-wallet-macos-aarch64, agent: hyphen-payout-agent }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libsecret-1-dev libjsoncpp-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - run: rustup default 1.97.0
      - name: Install pinned Flutter SDK
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.44.6 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          "$env:RUNNER_TEMP/flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build application and payout agent
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:CARGO_PROFILE_RELEASE_DEBUG='1'
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          flutter build ${{ matrix.platform }} --release
          cargo build --manifest-path rust/Cargo.toml --release --locked --bin hyphen-payout-agent
      - name: Package release archive
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path 'build/package' '${{ matrix.artifact }}'
          New-Item -ItemType Directory -Force $stage | Out-Null
          if ('${{ matrix.platform }}' -eq 'windows') { $app='build/windows/x64/runner/Release' }
          elseif ('${{ matrix.platform }}' -eq 'linux') { $app='build/linux/x64/release/bundle' }
          else { $app='build/macos/Build/Products/Release/hyphen_wallet.app' }
          if ('${{ matrix.platform }}' -eq 'macos') {
            Copy-Item $app $stage -Recurse
            Get-ChildItem 'build/macos/Build/Products/Release' -Filter '*.dSYM' -Directory -ErrorAction SilentlyContinue |
              Copy-Item -Destination $stage -Recurse
          } else {
            Copy-Item $app (Join-Path $stage 'app') -Recurse
          }
          Copy-Item (Join-Path rust/target/release '${{ matrix.agent }}') $stage
          Get-ChildItem rust/target/release -Filter '*.pdb' -ErrorAction SilentlyContinue | Copy-Item -Destination $stage
          Copy-Item README.md, README_CN.md, LICENSE $stage
          @('project=HyphenWallet','commit=${{ github.event.workflow_run.head_sha }}',"flutter=$(flutter --version --machine)","rustc=$(rustc --version)",'profile=release','debug=line-tables') |
            Set-Content (Join-Path $stage 'BUILD-INFO.txt') -Encoding utf8
          New-Item -ItemType Directory -Force dist | Out-Null
          if ($IsWindows) { $archive="dist/${{ matrix.artifact }}.zip"; Compress-Archive -Path "$stage/*" -DestinationPath $archive }
          else { $archive="dist/${{ matrix.artifact }}.tar.gz"; tar -czf $archive -C build/package '${{ matrix.artifact }}' }
          $name=Split-Path $archive -Leaf; $hash=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "$archive.sha256" -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "${{ matrix.artifact }}", path: "dist/*", if-no-files-found: error, retention-days: 14 }
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { path: dist, merge-multiple: true }
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN: ${{ github.event.workflow_run.run_number }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: pwsh
        run: |
          $tag="build-$env:RUN.$env:ATTEMPT-$($env:SHA.Substring(0,12))"
          $assets=(Get-ChildItem dist -File).FullName
          gh release create $tag @assets --target $env:SHA --title "Hyphen Wallet $tag" --prerelease --generate-notes --notes "Automated unaudited development build. Verify the matching SHA-256 file."
