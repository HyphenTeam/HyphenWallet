[package]
name = "rust_lib_hyphen_wallet"
default-run = "hyphen-payout-agent"
version = "0.1.2"
edition = "2024"
authors = ["Hyphen Contributors"]
license-file = "../LICENSE"
exclude = ["target", "dist"]
[workspace]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "hyphen-payout-agent"
path = "src/bin/payout_agent.rs"

[dependencies]
flutter_rust_bridge = "=2.13.0"

rustbinary = { version = "0.1.10", features = ["derive"] }
hyphen-crypto = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "8bb9f0f4c43f1fba8a20bbcb1a0e93b907ccccb7" }
hyphen-core = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "8bb9f0f4c43f1fba8a20bbcb1a0e93b907ccccb7" }
hyphen-tx = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "8bb9f0f4c43f1fba8a20bbcb1a0e93b907ccccb7" }
hyphen-wallet = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "8bb9f0f4c43f1fba8a20bbcb1a0e93b907ccccb7" }
hyphen-proof = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "8bb9f0f4c43f1fba8a20bbcb1a0e93b907ccccb7" }
hyphen-wire = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "8bb9f0f4c43f1fba8a20bbcb1a0e93b907ccccb7" }

# Cryptography
blake3 = "1.8.7"
curve25519-dalek = { version = "5.0.0", features = [
    "serde",
    "digest",
    "rand_core",
] }
ed25519-dalek = { version = "3.0.0", features = ["serde", "rand_core"] }
sha2 = "0.11.1"
hmac = "0.13.0"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
argon2 = { version = "0.6.0", features = ["zeroize"] }
chacha20poly1305 = "0.11.0"
subtle = "2.6.1"

rand = "0.10.4"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

# Encoding
bs58 = "0.5.1"
hex = "0.4.3"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
prost = "0.14.6"

# Security
zeroize = { version = "1.9.2", features = ["derive"] }
courierust = "1.1.3"

# Utilities
once_cell = "1.21.4"
tempfile = "3.27.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
