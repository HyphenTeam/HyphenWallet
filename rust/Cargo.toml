[package]
name = "rust_lib_hyphen_wallet"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"

# Hyphen blockchain crates
hyphen-crypto = { path = "../../crates/hyphen-crypto" }
hyphen-tx     = { path = "../../crates/hyphen-tx" }
hyphen-proof  = { path = "../../crates/hyphen-proof" }

# Cryptography
blake3 = "1.8"
curve25519-dalek = { version = "4.1", features = ["serde", "digest", "rand_core"] }
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
merlin = "3"

# Randomness
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }

# Encoding
bs58 = "0.5"
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
prost = "0.13"

# Security
zeroize = { version = "1", features = ["derive"] }

# Utilities
once_cell = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
