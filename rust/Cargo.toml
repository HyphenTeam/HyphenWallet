[package]
name = "rust_lib_hyphen_wallet"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "hyphen-payout-agent"
path = "src/bin/payout_agent.rs"

[dependencies]
flutter_rust_bridge = "=2.11.1"

# Hyphen blockchain crates
hyphen-crypto = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "fef7290dcbbeea20e8d231bf2ffcd13982a7046b" }
hyphen-tx     = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "fef7290dcbbeea20e8d231bf2ffcd13982a7046b" }
hyphen-proof  = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "fef7290dcbbeea20e8d231bf2ffcd13982a7046b" }

# Cryptography
blake3 = "1.8"
curve25519-dalek = { version = "4.1", features = ["serde", "digest", "rand_core"] }
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
merlin = "3"
argon2 = "0.5"
chacha20poly1305 = "0.10"
subtle = "2.6"

# Randomness
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }

# Encoding
bs58 = "0.5"
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
prost = "0.13"

# Security
zeroize = { version = "1", features = ["derive"] }

# Utilities
once_cell = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
