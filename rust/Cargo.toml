[package]
name = "rust_lib_hyphen_wallet"
version = "0.1.1"
edition = "2021"
authors = ["Hyphen Contributors"]
license-file = "../LICENSE"
exclude = ["target", "dist"]
[workspace]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "hyphen-payout-agent"
path = "src/bin/payout_agent.rs"

[dependencies]
flutter_rust_bridge = "=2.13.0"

rustbinary = { version = "0.1.8", features = ["derive"] }
hyphen-crypto = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "576bc67d972d1156fbabb1ddf579104d5ff2ff88" }
hyphen-tx = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "576bc67d972d1156fbabb1ddf579104d5ff2ff88" }
hyphen-proof = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "576bc67d972d1156fbabb1ddf579104d5ff2ff88" }
hyphen-wire = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "576bc67d972d1156fbabb1ddf579104d5ff2ff88" }

# Cryptography
blake3 = "1.8"
curve25519-dalek = { version = "5.0.0", features = [
    "serde",
    "digest",
    "rand_core",
] }
ed25519-dalek = { version = "3.0.0", features = ["serde", "rand_core"] }
sha2 = "0.11.1"
hmac = "0.13.0"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
argon2 = "0.6"
chacha20poly1305 = "0.11"
subtle = "2.6"

rand = "0.10.3"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

# Encoding
bs58 = "0.5"
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
prost = "0.14.4"

# Security
zeroize = { version = "1", features = ["derive"] }
courierust = "1.0.9"

# Utilities
once_cell = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
