org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Kotlin incremental compilation to prevent cross-drive cache
# corruption on Windows (pub cache on C: vs project on D:).
kotlin.incremental=false
# Suppress JVM target mismatch checks — we force Java 17 on tasks directly
# but cannot modify Flutter plugins' android.compileOptions in the pub cache.
kotlin.jvm.target.validation.mode=ignore
