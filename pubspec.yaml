name: hyphen_wallet
description: "Hyphen blockchain wallet — quantum-resistant, privacy-focused"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0-210.2.beta

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  rust_lib_hyphen_wallet:
    path: rust_builder
  flutter_rust_bridge: 2.11.1
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.4
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  local_auth: ^2.3.0
  path_provider: ^2.1.5
  dynamic_color: ^1.7.0
  nfc_manager: ^3.5.0
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/Hyphen.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Hyphen.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/Hyphen.png"
  windows:
    generate: true
    image_path: "assets/images/Hyphen.png"
  macos:
    generate: true
    image_path: "assets/images/Hyphen.png"
